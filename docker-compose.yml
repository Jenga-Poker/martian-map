services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    environment:
      # Dentro de Docker, Ollama corre en el host (OLLAMA_HOST=0.0.0.0:11434)
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
